<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="confluence-cli is an agent-friendly Confluence Cloud CLI with stable JSON output, safe dry-run writes, Markdown support, and automation-ready workflows."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b1120" />
    <link rel="canonical" href="https://laipz8200.github.io/confluence-cli/" />
    <meta
      property="og:title"
      content="confluence-cli | Agent-friendly Confluence Cloud CLI"
    />
    <meta
      property="og:description"
      content="Stable JSON output, safe dry-run writes, Markdown-to-storage conversion, and automation-ready Confluence Cloud workflows from your terminal."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://laipz8200.github.io/confluence-cli/" />
    <meta property="og:site_name" content="confluence-cli" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="confluence-cli | Agent-friendly Confluence Cloud CLI"
    />
    <meta
      name="twitter:description"
      content="Agent-friendly Confluence Cloud workflows with stable JSON, dry-run writes, Markdown support, and automation-ready commands."
    />
    <title>confluence-cli | Agent-friendly Confluence Cloud CLI</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "confluence-cli",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Linux, macOS, Windows",
        "description": "Agent-friendly Confluence Cloud CLI with stable JSON output, safe dry-run writes, Markdown support, and automation-ready workflows.",
        "url": "https://laipz8200.github.io/confluence-cli/",
        "downloadUrl": "https://github.com/laipz8200/confluence-cli",
        "codeRepository": "https://github.com/laipz8200/confluence-cli",
        "programmingLanguage": "Rust",
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="product-name">
        <div class="hero__background" aria-hidden="true">
          <span class="hero__flow hero__flow--one"></span>
          <span class="hero__flow hero__flow--two"></span>
        </div>
        <div class="hero__inner">
          <img
            class="hero__logo"
            src="assets/logo.svg"
            alt="confluence-cli logo"
            width="160"
            height="160"
          />
          <h1 id="product-name">confluence-cli</h1>
          <p class="hero__tagline">
            Agent-friendly Confluence Cloud workflows from your terminal.
          </p>
          <div class="hero__actions" aria-label="Primary actions">
            <a class="button button--primary" href="#install">Install</a>
            <a
              class="button button--secondary"
              href="https://github.com/laipz8200/confluence-cli"
              rel="noreferrer"
            >
              GitHub
            </a>
          </div>
        </div>
        <a class="scroll-cue" href="#install" aria-label="Scroll to install section">
          <span class="scroll-cue__icon" aria-hidden="true"></span>
        </a>
      </section>

      <section class="install" id="install" aria-labelledby="install-title">
        <div class="install__inner">
          <p class="section-label">Install</p>
          <h2 id="install-title">Install the latest release.</h2>
          <div class="terminal" role="region" aria-label="Installation commands">
            <div class="terminal__chrome">
              <div class="terminal__controls" aria-hidden="true">
                <span class="terminal__control terminal__control--red"></span>
                <span class="terminal__control terminal__control--yellow"></span>
                <span class="terminal__control terminal__control--green"></span>
              </div>
              <p class="terminal__title">confluence-cli install</p>
              <button
                class="terminal__copy"
                type="button"
                data-copy-command
                data-command="curl -fsSL https://raw.githubusercontent.com/laipz8200/confluence-cli/main/install.sh | sh"
                aria-label="Copy install command"
              >
                <svg
                  aria-hidden="true"
                  class="terminal__copy-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M8 8.5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M4 13.5v-8a2 2 0 0 1 2-2h8"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="terminal__copy-label" aria-live="polite">Copy</span>
              </button>
            </div>
            <pre class="terminal__body"><code><span class="terminal__prompt">$</span> curl -fsSL https://raw.githubusercontent.com/laipz8200/confluence-cli/main/install.sh | sh</code></pre>
          </div>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const copyButton = document.querySelector("[data-copy-command]");
        const copyLabel = copyButton?.querySelector(".terminal__copy-label");
        const command = copyButton?.dataset.command;

        if (!copyButton || !copyLabel || !command) {
          return;
        }

        const setCopyLabel = (label, state = "idle") => {
          copyLabel.textContent = label;
          copyButton.dataset.copyState = state;
          window.clearTimeout(copyButton.copyReset);

          if (state !== "idle") {
            copyButton.copyReset = window.setTimeout(() => {
              copyLabel.textContent = "Copy";
              copyButton.dataset.copyState = "idle";
            }, 1800);
          }
        };

        const fallbackCopy = () => {
          const textarea = document.createElement("textarea");
          textarea.value = command;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.inset = "0 auto auto 0";
          textarea.style.opacity = "0";
          document.body.append(textarea);
          textarea.focus({ preventScroll: true });
          textarea.select();
          textarea.setSelectionRange(0, textarea.value.length);

          const copied =
            typeof document.execCommand === "function" &&
            document.execCommand("copy");
          textarea.remove();

          if (!copied) {
            throw new Error("Copy command failed");
          }
        };

        copyButton.addEventListener("click", async () => {
          try {
            if (window.navigator?.clipboard?.writeText) {
              await window.navigator.clipboard.writeText(command);
            } else {
              fallbackCopy();
            }

            setCopyLabel("Copied", "copied");
          } catch {
            try {
              fallbackCopy();
              setCopyLabel("Copied", "copied");
            } catch {
              setCopyLabel("Failed", "failed");
            }
          }
        });
      })();
    </script>
  </body>
</html>
